<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay – Customer app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#22335A; --mist:#E5ECF2; --mist-2:#F3F6F9; --line:#C9D4DF;
  --slate:#4B5B78; --orange:#FF5A1F; --orange-dk:#E2480F; --white:#fff;
  --safe:#1D8A55; --safe-bg:#DDF2E6; --wait:#9A6400; --wait-bg:#FFF0C7; --unacc:#C42B3B; --unacc-bg:#FBE0E3;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:8px; --r-m:14px; --r-l:22px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--navy);background:var(--mist);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.on-dark :focus-visible,.alert :focus-visible{outline-color:#fff}
.num{font-variant-numeric:tabular-nums}
h1:focus{outline:none}

/* ---------- Desktop shell ---------- */
.shell{display:grid;grid-template-columns:270px 1fr 320px;height:100vh}
.rail{background:var(--navy);color:#fff;overflow:auto;padding:24px 16px 32px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--orange);display:grid;place-items:center}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:#AFC0D6;font-size:13px}
.rail h2{font-size:13px;font-weight:500;color:#AFC0D6;margin:18px 8px 6px}
.rail button{display:flex;width:100%;text-align:left;background:none;border:0;color:#E8EEF6;padding:8px 10px;border-radius:8px;font-size:15px;gap:8px;align-items:baseline}
.rail button:hover{background:var(--navy-2)}
.rail button[aria-current="true"]{background:#fff;color:var(--navy);font-weight:700}
.rail button .fr{margin-left:auto;font-size:12px;opacity:.6}
.stage{display:grid;place-items:center;overflow:auto;padding:28px}
.notes{background:var(--mist-2);border-left:1px solid var(--line);overflow:auto;padding:24px 22px}
.notes h3{font-size:20px;margin:0 0 4px;line-height:1.2}
.notes .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.notes .tag{font-size:12px;background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--slate)}
.notes p{margin:0 0 10px;color:var(--slate);font-size:15px}
.ctrl{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.ctrl h4{margin:0 0 10px;font-size:15px}
.ctrl label{display:block;font-size:13px;color:var(--slate);margin:10px 0 4px}
.ctrl select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ctrl .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cbtn{flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--navy);background:#fff;font-weight:700;font-size:14px;min-width:0}
.cbtn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.cbtn.dark{background:var(--navy);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px}

/* ---------- Phone ---------- */
.phone{width:390px;height:812px;background:#0C1426;border-radius:52px;padding:12px;box-shadow:0 30px 60px -20px rgba(20,33,61,.45),0 0 0 1px #2B3A5C inset;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--mist);display:flex;flex-direction:column}
.sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:700;z-index:3}
.sbar .icons{display:flex;gap:6px;align-items:center}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0C1426;border-radius:20px;z-index:4}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:auto;padding:4px 20px 24px}
.dock{flex:none;padding:12px 20px 26px;background:linear-gradient(to top,var(--mist) 75%,rgba(229,236,242,0));display:grid;gap:10px}

/* App bar */
.appbar{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;flex:none}
.appbar h1{font-size:20px;margin:0;line-height:1.2;flex:1}
.back{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.back:hover{background:rgba(20,33,61,.08)}
.step{font-size:13px;color:var(--slate);white-space:nowrap}

/* Incident banner */
.ibanner{background:var(--orange);color:#fff;padding:8px 18px 12px;flex:none;display:flex;gap:12px;align-items:center}
.ibanner .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.ibanner b{display:block;font-size:18px;line-height:1.15}
.ibanner small{font-size:14px;opacity:.95}
.ibanner .el{margin-left:auto;font-size:14px;font-weight:700;text-align:right;white-space:nowrap}

/* Type */
.h-xl{font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:800;margin:0}
.h-l{font-size:26px;line-height:1.1;letter-spacing:-.015em;font-weight:800;margin:0}
.h-m{font-size:19px;line-height:1.2;font-weight:700;margin:0}
.muted{color:var(--slate)}
.small{font-size:14px}
p{margin:0}
.stack>*+*{margin-top:12px}
.stack-l>*+*{margin-top:22px}
.sec-h{font-size:15px;font-weight:700;color:var(--slate);margin:22px 0 8px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 18px;border-radius:var(--r-m);border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;font-size:17px;width:100%;text-align:center}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:rgba(20,33,61,.06)}
.btn.light{background:#fff;border-color:#fff;color:var(--navy)}
.btn.pop{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pop:hover{background:var(--orange-dk);border-color:var(--orange-dk)}
.btn.safe{background:var(--safe);border-color:var(--safe)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.help-btn{min-height:104px;border-radius:var(--r-l);font-size:26px;letter-spacing:-.01em;flex-direction:column;gap:2px}
.help-btn small{font-size:14px;font-weight:500;opacity:.95}
.link{background:none;border:0;padding:6px 0;color:var(--navy);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Surfaces */
.panel{background:#fff;border-radius:var(--r-m);padding:16px}
.list{background:#fff;border-radius:var(--r-m);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--mist);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--mist-2)}
.li .grow{flex:1;min-width:0}
.li b{display:block}
.av{width:44px;height:44px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:var(--navy)}
.av.o{background:var(--orange);color:#fff}
.av.n{background:var(--navy);color:#fff}
.chev{opacity:.5;flex:none}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.safe{background:var(--safe-bg);color:var(--safe)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.unacc{background:var(--unacc-bg);color:var(--unacc)}
.pill.neutral{background:var(--mist);color:var(--slate)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.wait i{border-radius:2px}
.pill.unacc i{border-radius:0;transform:rotate(45deg)}

/* Inputs */
.field{display:block}
.field span{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.field em{font-style:normal;font-weight:400;color:var(--slate)}
.input{width:100%;min-height:52px;padding:12px 14px;border-radius:var(--r-s);border:2px solid var(--line);background:#fff;font-size:17px}
.input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(20,33,61,.15)}
textarea.input{min-height:90px;resize:vertical}
.choice{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-m);background:#fff;border:2px solid transparent;cursor:pointer;width:100%;text-align:left}
.choice:hover{border-color:var(--line)}
.choice[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid var(--slate);flex:none;margin-top:1px;display:grid;place-items:center}
.choice[aria-checked="true"] .radio{border-color:var(--navy)}
.choice[aria-checked="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--navy)}
.choice b{display:block;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:#fff;border:0;border-radius:var(--r-m);padding:14px 16px;text-align:left;min-height:64px}
.tg{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
[aria-checked="true"] .tg{background:var(--navy)}
[aria-checked="true"] .tg::after{transform:translateX(20px)}
.check{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--r-m);padding:14px 16px;width:100%;border:0;text-align:left}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--slate);flex:none;display:grid;place-items:center}
[aria-checked="true"] .box{background:var(--navy);border-color:var(--navy)}
[aria-checked="true"] .box::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}

/* Callouts */
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-s);background:var(--mist-2);border-left:4px solid var(--navy);font-size:15px}
.note.warn{border-left-color:var(--orange);background:#FFF1EA}
.note.ok{border-left-color:var(--safe);background:var(--safe-bg)}
.note.off{background:var(--navy);color:#fff;border-left-color:var(--orange)}
.note svg{flex:none;margin-top:2px}

/* Home place block */
.place{background:var(--navy);color:#fff;border-radius:var(--r-l);padding:20px;position:relative;overflow:hidden}
.place .lvl{font-size:64px;font-weight:800;line-height:.9;letter-spacing:-.04em}
.place .lvl span{font-size:22px;font-weight:700;letter-spacing:0;margin-right:4px;opacity:.75}
.place .bldg{font-size:17px;font-weight:700;margin-top:6px}
.place small{color:#AFC0D6}
.place .floors{position:absolute;right:18px;top:18px;bottom:18px;width:34px;display:flex;flex-direction:column;gap:2px}
.place .floors i{flex:1;background:rgba(255,255,255,.14);border-radius:1px}
.place .floors i.me{background:#fff}
.calm{display:flex;align-items:center;gap:10px;font-weight:700}
.dot-ok{width:12px;height:12px;border-radius:50%;background:var(--safe);box-shadow:0 0 0 4px var(--safe-bg)}

/* Incident guidance */
.guide{display:grid;grid-template-columns:58px 1fr;gap:16px;align-items:start}
.tower{display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--navy);border-radius:10px 10px 4px 4px;position:relative}
.tower i{height:5px;background:rgba(255,255,255,.16);border-radius:1px}
.tower i.fire{background:var(--orange)}
.tower i.me{background:#fff}
.tower i.fire.me{background:repeating-linear-gradient(90deg,var(--orange) 0 6px,#fff 6px 12px)}
.tower-cap{font-size:12px;color:var(--slate);text-align:center;margin-top:6px;line-height:1.2}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.35}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.steps li b{display:block}
.loc{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--slate);margin-top:6px}

/* Full-screen alert */
.alert{background:var(--orange);color:#fff;flex:1;display:flex;flex-direction:column;padding:18px 24px 28px;position:relative}
.alert .big-ic{width:88px;height:88px;border-radius:26px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:26px 0 22px}
.alert .h-xl{font-size:44px}
.alert .where{font-size:20px;font-weight:700;margin-top:10px}
.alert .what{font-size:28px;font-weight:800;margin-top:26px;padding-top:18px;border-top:2px solid rgba(255,255,255,.35)}
.alert.navy{background:var(--navy)}
.pulse{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,255,255,.0);animation:pulse 1.1s ease-in-out 4}
@keyframes pulse{50%{box-shadow:inset 0 0 0 14px rgba(255,255,255,.75)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}


/* Profile cards */
.pcard{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r-m);background:#fff;border:2px solid transparent;width:100%;text-align:left;cursor:pointer;min-height:78px}
.pcard:hover{border-color:var(--line)}
.pcard .pi{width:52px;height:52px;border-radius:16px;background:var(--mist);display:grid;place-items:center;color:var(--navy);flex:none}
.pcard b{display:block;font-size:20px}
.pcard .tick{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--navy);display:none;place-items:center;flex:none}
.pcard[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.pcard[aria-checked="true"] .pi{background:var(--navy);color:#fff}
.pcard[aria-checked="true"] .tick{display:grid}

/* 3D floor map (rendered in Blender) */
.map3d{position:relative;border-radius:var(--r-m);background:#fff;padding:6px 4px 2px;overflow:hidden}
.map3d img{display:block;width:100%;height:auto}
.mp{position:absolute;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mp.you{background:var(--orange);color:var(--navy);font-size:14px}
.mp.no{background:var(--unacc);color:#fff}
.mp.near{outline:2px solid var(--orange);outline-offset:1px}
.maplab{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 2px;font-size:14px;color:var(--slate)}
.gsteps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gsteps li{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:700;color:var(--navy)}
.gsteps .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}

/* Urgent centred alert */
.alert{align-items:center;text-align:center;padding:30px 22px 26px;overflow:hidden}
.alert::before,.alert::after{content:"";position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(-45deg,var(--navy) 0 16px,var(--orange) 16px 32px)}
.alert::before{top:0}.alert::after{bottom:0}
.alert .aw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:100%}
.siren{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:22px}
.siren i{position:absolute;inset:0;border-radius:50%;border:4px solid #fff;opacity:0;animation:ring 1.4s ease-out infinite}
.siren i:nth-child(2){animation-delay:.7s}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.siren .big-ic{position:relative;margin:0;width:112px;height:112px;border-radius:50%;background:#fff;color:var(--orange)}
.alert .al-kind{margin:0;font-size:72px;font-weight:800;line-height:1;letter-spacing:-.02em}
.alert .where{font-size:20px;font-weight:700;margin-top:12px}
.alert .what-pill{margin-top:24px;background:#fff;color:var(--navy);font-size:30px;font-weight:800;padding:12px 26px;border-radius:999px}
.alert .al-sub{font-size:19px;font-weight:700;margin-top:18px;max-width:280px}
@media (prefers-reduced-motion:reduce){.siren i{animation:none;opacity:.5;transform:scale(1.15)}}

/* Location + help-on-the-way */
.loccard{background:#fff;border-radius:var(--r-m);padding:18px;display:grid;gap:14px}
.loccard .big{display:flex;gap:14px;align-items:center}
.loccard .big .sw{width:60px;height:60px;border-radius:18px;background:var(--navy);display:grid;place-items:center;flex:none}
.locrow{display:flex;gap:12px;align-items:center;font-size:16px}
.locrow .ri{width:36px;height:36px;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--navy);flex:none}
.locrow .ok{margin-left:auto;color:var(--safe);display:grid;place-items:center}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--mist) 0,var(--mist-2) 50%,var(--mist) 100%);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.team{display:flex;align-items:center;gap:16px;background:#fff;border-radius:var(--r-m);padding:16px}
.team .ti{width:60px;height:60px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.team b{font-size:19px;display:block}
.team .eta{margin-left:auto;text-align:right;font-size:13px;color:var(--slate);line-height:1.1}
.team .eta b{font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums}

/* Timeline / responders */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--mist)}
.tl li:first-child{border-radius:var(--r-m) var(--r-m) 0 0}
.tl li:last-child{border-radius:0 0 var(--r-m) var(--r-m);border-bottom:0}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--wait-bg);border-top-color:var(--wait);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-color:var(--wait)}}
.esc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-s);background:#FFF1EA;border:2px solid var(--orange);font-size:15px;font-weight:700}
.esc.done{border-color:var(--safe);background:var(--safe-bg);color:var(--safe)}

.big-status{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:22px 20px;border-radius:var(--r-l);background:var(--navy);color:#fff}
.big-status.ok{background:var(--safe)}
.big-status .ring{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}

/* Undo bar */
.undo{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:var(--r-m);padding:10px 10px 10px 16px;font-size:15px}
.undo .bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px;overflow:hidden}
.undo .bar i{display:block;height:100%;background:var(--orange);width:100%;animation:shrink 5s linear forwards}
@keyframes shrink{to{width:0}}
.undo button{background:#fff;color:var(--navy);border:0;border-radius:10px;padding:10px 14px;font-weight:800;min-height:44px}

/* Counts (warden) */
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{border-radius:var(--r-m);padding:12px;background:#fff;border-top:5px solid}
.count b{font-size:32px;line-height:1;display:block;font-weight:800}
.count span{font-size:13px;font-weight:700}
.count.wait{border-color:var(--wait)} .count.wait span{color:var(--wait)}
.count.safe{border-color:var(--safe)} .count.safe span{color:var(--safe)}
.count.unacc{border-color:var(--unacc)} .count.unacc span{color:var(--unacc)}
.mini{min-height:40px;padding:6px 12px;border-radius:10px;border:2px solid var(--navy);background:#fff;font-weight:700;font-size:14px}
.mini.dark{background:var(--navy);color:#fff}
details.fold{background:#fff;border-radius:var(--r-m)}
details.fold summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:52px}
details.fold summary::-webkit-details-marker{display:none}
details.fold[open] summary{border-bottom:1px solid var(--mist)}

/* Map */
.mapwrap{background:#fff;border-radius:var(--r-m);padding:12px}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--mist);font-size:15px}
.legend li:last-child{border-bottom:0}
.sw{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* Login */
.hero-login{padding:18px 4px 6px}
.wordmark{display:flex;align-items:center;gap:12px}
.wordmark .brand-mark{width:46px;height:46px;border-radius:13px}
.wordmark b{font-size:26px;letter-spacing:-.02em}

.toast{position:absolute;left:16px;right:16px;bottom:30px;background:var(--navy);color:#fff;padding:14px 16px;border-radius:var(--r-m);font-weight:700;display:flex;gap:10px;align-items:center;z-index:10;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


.rail h2 small{font-weight:400;opacity:.8}
.rail button .n{width:18px;flex:none;font-variant-numeric:tabular-nums;opacity:.55;font-size:13px}
.rail button[aria-current="true"] .n{opacity:.7}
.rail details{margin-top:18px;border-top:1px solid rgba(255,255,255,.14);padding-top:6px}
.rail summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#AFC0D6;font-size:14px}
.rail summary::-webkit-details-marker{display:none}
.rail summary:hover{background:var(--navy-2)}
.rail summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.rail details[open] summary::after{transform:rotate(45deg)}
.rail details button{color:#C9D6E6}
.notes .tag.hl{background:var(--navy);color:#fff;border-color:var(--navy)}
.notes .tag.bk{background:#fff;border-style:dashed}

/* ---------- Ping mascot ---------- */
.ping{display:inline-block;flex:none;line-height:0}
.ping svg{overflow:visible;display:block}
.ping.st-standby{--ping-c:#2563EB}
.ping.st-alert{--ping-c:#F59E0B}
.ping.st-safe{--ping-c:#10B981}
.ping.off .p-ring{stroke-dasharray:7 6}
.p-body{animation:pbob 3.4s ease-in-out infinite}
@keyframes pbob{50%{transform:translateY(-3px)}}
.pose-jump .p-body{animation:pjump 1.2s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes pjump{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px)}}
.p-lanyard{transform-box:view-box;transform-origin:80px 50px;animation:psway 3.4s ease-in-out infinite}
@keyframes psway{50%{transform:rotate(3deg)}}
.pose-jump .p-lanyard{animation-duration:.6s}
.p-wave{transform-box:view-box;transform-origin:130px 104px;animation:pwave 1.4s ease-in-out infinite}
@keyframes pwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.p-point{animation:ppoint 1.6s ease-in-out infinite}
@keyframes ppoint{50%{transform:translateX(4px)}}
.p-plane{animation:pplane 2.2s ease-in-out infinite}
@keyframes pplane{50%{transform:translate(6px,-5px)}}
.p-steam{animation:psteam 2s ease-in-out infinite}
@keyframes psteam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
.p-badge{transform-box:fill-box;transform-origin:center;animation:ppop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes ppop{from{transform:scale(0)}}
.p-signal-rings ellipse{transform-box:view-box;transform-origin:80px 190px}
.st-alert .p-signal-rings ellipse{animation:prip 2.6s ease-out infinite}
.st-alert .p-signal-rings ellipse:nth-child(2){animation-delay:.6s}
.st-alert .p-signal-rings ellipse:nth-child(3){animation-delay:1.2s}
.st-standby .p-signal-rings ellipse{animation:pglow 3s ease-in-out infinite}
@keyframes prip{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.15);opacity:0}}
@keyframes pglow{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.ping *{animation:none!important}}
.pingrow{display:flex;gap:8px;align-items:center}
.pingrow>p,.pingrow>div{flex:1;min-width:0}
.pingrow>p{font-size:16px;color:var(--slate)}
.pingcenter{display:grid;place-items:center;margin-bottom:-6px}
.how{list-style:none;margin-left:0;margin-right:0;margin-bottom:0;padding:0;display:grid;gap:12px}
.how li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px}
.how .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--navy);flex:none}
.how .ico.o{background:var(--orange)}
.dock2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock2 .btn{font-size:15px;min-height:56px;padding:10px 12px}
/* Mobile: phone becomes the screen */
.mtop{display:none}
@media (max-width:1100px){
  .shell{grid-template-columns:1fr 300px}
  .rail{display:none}
  .mtop{display:flex}
}
@media (max-width:760px){
  .shell{display:block;height:auto}
  .notes{display:none}
  .stage{padding:0;display:block}
  .phone{width:100%;height:calc(100vh - 52px);height:calc(100dvh - 52px);border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .notch,.sbar{display:none}
}
.mtop{align-items:center;gap:10px;padding:8px 12px;background:var(--navy);color:#fff;height:52px}
.mtop select{flex:1;padding:8px;border-radius:8px;border:0;font-weight:700;background:#fff;color:var(--navy)}
@media (min-width:761px) and (max-width:1100px){.mtop{position:fixed;top:0;left:0;right:300px;z-index:20}.stage{padding-top:70px}}
</style>
</head>
<body>
<div class="mtop">
  <span id="mMark" style="display:grid"></span>
  <label class="sr" for="mSel">Jump to screen</label>
  <select id="mSel"></select>
</div>
<div class="shell">
  <nav class="rail" aria-label="Prototype screens">
    <div class="brand"><span id="railMark" style="display:grid"></span><div><b>Relay</b><small>Customer app prototype</small></div></div>
    <div id="railList"></div>
  </nav>
  <main class="stage">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="notch" aria-hidden="true"></div>
        <div class="sbar" id="sbar"></div>
        <div class="view" id="view" aria-live="off"></div>
        <div id="live" class="sr" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <aside class="notes" aria-label="Screen notes and demo controls">
    <div id="noteBody"></div>
    <div class="ctrl">
      <h4>Demo controls</h4>
      <p class="small muted" style="margin:0">These stand in for the Command view, which is being built separately.</p>
      <label for="cUser">Signed in as</label>
      <select id="cUser"></select>
      <label for="cKind">Incident type</label>
      <select id="cKind">
        <option value="fire">Fire</option><option value="earthquake">Earthquake</option>
        <option value="outage">Power outage</option><option value="security">Security threat</option>
      </select>
      <div class="row">
        <button class="cbtn pri" data-act="trigger">Trigger on L22</button>
        <button class="cbtn" data-act="endIncident">End incident</button>
      </div>
      <div class="row">
        <button class="cbtn dark" data-act="simHelp">Send Aisyah's help request now</button>
      </div>
      <div class="switch"><span>Offline (no signal)</span><button class="toggle" style="width:auto;min-height:0;padding:0;background:none" role="switch" aria-checked="false" id="cOff" data-act="offline" aria-label="Offline mode"><span class="tg"></span></button></div>
      <div class="row"><button class="cbtn" data-act="reset">Reset demo</button></div>
    </div>
  </aside>
</div>

<script>
/* =========================================================
   Icons
   ========================================================= */
const P = {
  flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.5 2 2.5-.8-3 0-5.5 1-8z"/>',
  quake:'<path d="M2 12h3l2-5 3 10 3-14 3 12 2-3h4"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M9.5 12.5 11 14l3.5-3.5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  hand:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6a1.5 1.5 0 0 1 3 0v7.5c0 4-2.5 7.5-6.5 7.5-2.5 0-4-1-5.5-3L3 14.5a1.5 1.5 0 0 1 2.3-2L8 15"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  stairs:'<path d="M3 20h5v-5h5v-5h5V5h3"/>',
  back:'<path d="M15 5 8 12l7 7"/>',
  chev:'<path d="m9 5 7 7-7 7"/>',
  wifiOff:'<path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.4-1.7"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8A15 15 0 0 0 10.7 5"/><path d="M12 20h.01"/>',
  gps:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
  sms:'<path d="M4 5h16v11H8l-4 4z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.5 4.7 4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  gauge:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><path d="M6 17h.01M18 17h.01"/>',
  helmet:'<path d="M4 15a8 8 0 0 1 16 0"/><path d="M2 15h20v3H2z"/><path d="M12 7V4M9 8l-1.5-2.5M15 8l1.5-2.5"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  cross:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  walk:'<circle cx="13" cy="4.5" r="1.8"/><path d="M12.5 8.5 10 13l3 2.5-1 5.5M12.5 8.5l3.5 2.5 2.5.5M10 13l-2.5 2"/>',
  door:'<path d="M5 21V4h11v17"/><path d="M3 21h18M13 12h.01"/>'
};
const ic = (n,s=22,w=2.2,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;


/* =========================================================
   Ping, the Relay mascot. One modular SVG, driven by pose + state.
   State colour comes from --ping-c (standby / alert / safe), per the brand spec.
   ========================================================= */
const PC={shell:'#F8FAFC',slate:'#1E293B',amber:'#F59E0B',glow:'#FBBF24',edge:'#CBD5E1'};
const eyeLine=(d,w=3.4)=>`<path d="${d}" fill="none" stroke="${PC.glow}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const EYES={
 open:`<ellipse cx="66" cy="93" rx="5.5" ry="7" fill="${PC.glow}"/><ellipse cx="94" cy="93" rx="5.5" ry="7" fill="${PC.glow}"/>`+eyeLine('M71 106q9 7 18 0'),
 happy:eyeLine('M59 96q7-11 14 0',4)+eyeLine('M87 96q7-11 14 0',4)+eyeLine('M70 105q10 8 20 0'),
 joy:eyeLine('M59 96q7-11 14 0',4)+eyeLine('M87 96q7-11 14 0',4)+`<path d="M68 103q12 16 24 0z" fill="${PC.glow}"/>`,
 calm:eyeLine('M59 93q7 8 14 0',4)+eyeLine('M87 93q7 8 14 0',4)+eyeLine('M72 106q8 4 16 0'),
 focus:`<ellipse cx="72" cy="92" rx="5" ry="6.5" fill="${PC.glow}"/><ellipse cx="100" cy="92" rx="5" ry="6.5" fill="${PC.glow}"/>`+eyeLine('M76 106h14')
};
const core=eyes=>`
 <g class="p-lanyard"><path d="M62 -2L76 50M98 -2L84 50" stroke="${PC.amber}" stroke-width="8" fill="none"/><rect x="73" y="44" width="14" height="10" rx="3" fill="${PC.edge}"/></g>
 <g class="p-led-band"><circle cx="80" cy="100" r="57" fill="none" stroke="var(--ping-c)" stroke-opacity=".22" stroke-width="7"/>
 <circle class="p-ring" cx="80" cy="100" r="52" fill="${PC.shell}" stroke="var(--ping-c)" stroke-width="5"/></g>
 <circle cx="80" cy="100" r="45" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
 <g class="p-visor-eyes"><rect x="46" y="72" width="68" height="44" rx="22" fill="${PC.slate}"/>${eyes}</g>`;
const RINGS=`<g class="p-signal-rings" fill="none" stroke="var(--ping-c)" stroke-width="2"><ellipse cx="80" cy="190" rx="34" ry="6" opacity=".55"/><ellipse cx="80" cy="190" rx="52" ry="9" opacity=".35"/><ellipse cx="80" cy="190" rx="70" ry="12" opacity=".18"/></g>`;
const shoe=(x,y,r=0)=>`<g transform="rotate(${r} ${x+12} ${y+6})"><rect x="${x}" y="${y}" width="24" height="12" rx="6" fill="${PC.slate}"/><rect x="${x+1}" y="${y+8}" width="22" height="4" rx="2" fill="#fff"/></g>`;
const legStroke=d=>`<path d="${d}" fill="none" stroke="${PC.slate}" stroke-width="7" stroke-linecap="round"/>`;
const LEGS_STAND=`<g class="p-legs">${legStroke('M66 148V178')}${legStroke('M94 148V178')}${shoe(54,176)}${shoe(82,176)}</g>`;
const arm=d=>`<path d="${d}" fill="none" stroke="${PC.slate}" stroke-width="6.5" stroke-linecap="round"/>`;
const hand=(x,y)=>`<circle cx="${x}" cy="${y}" r="7.5" fill="#fff" stroke="${PC.edge}" stroke-width="1.8"/>`;
const thumb=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="14" rx="3.5" fill="#fff" stroke="${PC.edge}" stroke-width="1.5"/>`;
const badge=(x,y,r,d)=>`<g class="p-badge" style="animation-delay:${d}s"><g transform="translate(${x} ${y}) rotate(${r})"><rect x="-13" y="-17" width="26" height="34" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><circle cx="0" cy="-5" r="4.5" fill="#2563EB"/><path d="M-8 10q8-11 16 0z" fill="#2563EB"/></g></g>`;
const ARM_L_DOWN=`<g class="p-arm-left">${arm('M30 106Q20 124 24 142')}${hand(24,144)}</g>`;
const ARM_R_DOWN=`<g class="p-arm-right">${arm('M130 106Q140 124 136 142')}${hand(136,144)}</g>`;

function poseParts(pose){
 switch(pose){
 case 'wave': return {eyes:'happy',legs:LEGS_STAND,arms:
   `<g class="p-arm-left"><rect x="3" y="132" width="26" height="32" rx="3" fill="#fff" stroke="${PC.edge}" stroke-width="2"/><g fill="${PC.slate}"><rect x="7" y="136" width="8" height="8" rx="1"/><rect x="17" y="136" width="8" height="8" rx="1"/><rect x="7" y="146" width="8" height="8" rx="1"/><rect x="18" y="148" width="4" height="4"/><rect x="23" y="154" width="3" height="3"/></g>${arm('M30 106Q20 122 26 136')}${hand(26,138)}</g>
    <g class="p-arm-right p-wave">${arm('M130 106Q152 98 152 76')}${hand(152,70)}</g>`};
 case 'checklist': return {eyes:'happy',legs:LEGS_STAND,arms:
   `<g class="p-arm-left"><rect x="2" y="116" width="30" height="38" rx="3" fill="#fff" stroke="${PC.slate}" stroke-width="2.2"/><rect x="10" y="112" width="14" height="7" rx="2" fill="${PC.slate}"/><g stroke="#2563EB" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 128l2.5 2.5L15 125"/><path d="M8 140l2.5 2.5L15 137"/></g><g stroke="${PC.edge}" stroke-width="2.4" stroke-linecap="round"><path d="M19 128h9M19 140h9"/></g>${arm('M30 106Q22 124 26 140')}${hand(26,142)}</g>
    <g class="p-arm-right"><path d="M127 130h20l-2.5 20h-15z" fill="#fff" stroke="${PC.edge}" stroke-width="2"/><rect x="129" y="136" width="16" height="8" fill="${PC.amber}"/><rect x="125" y="126" width="24" height="6" rx="3" fill="${PC.slate}"/>${arm('M130 106Q124 124 132 142')}${hand(132,144)}</g>`};
 case 'thumbs': return {eyes:'happy',legs:LEGS_STAND,arms:
   `${badge(-6,34,-12,.1)}${badge(166,30,12,.3)}
    <g class="p-arm-left">${arm('M30 104Q8 106 6 86')}${thumb(2,64)}${hand(6,84)}</g>
    <g class="p-arm-right">${arm('M130 104Q152 106 154 86')}${thumb(151,64)}${hand(154,84)}</g>`};
 case 'point': return {eyes:'open',legs:LEGS_STAND,arms:
   `<g class="p-arm-left"><rect x="4" y="124" width="28" height="22" rx="2" fill="#fff" stroke="${PC.edge}" stroke-width="2"/><path d="M13 124v22M23 124v22" stroke="${PC.edge}" stroke-width="1.5"/><circle cx="18" cy="135" r="3" fill="#2563EB"/>${arm('M30 106Q20 124 26 142')}${hand(26,144)}</g>
    <g class="p-arm-right p-point">${arm('M130 104Q150 100 160 98')}<rect x="160" y="94" width="16" height="7" rx="3.5" fill="#fff" stroke="${PC.edge}" stroke-width="1.5"/>${hand(158,98)}</g>`};
 case 'seated': return {eyes:'calm',legs:`<g class="p-legs">${legStroke('M66 148Q62 170 90 174')}${legStroke('M94 148Q98 170 70 176')}${shoe(80,168)}${shoe(58,170)}</g>`,arms:
   `<g class="p-arm-left">${arm('M30 106Q30 140 74 150')}</g><g class="p-arm-right">${arm('M130 106Q130 140 86 150')}</g>${hand(75,150)}${hand(85,150)}`};
 case 'jump': return {eyes:'joy',ground:`<ellipse cx="80" cy="190" rx="22" ry="4" fill="${PC.slate}" opacity=".12"/>`,
   legs:`<g class="p-legs">${legStroke('M68 148L56 166')}${legStroke('M92 148L104 166')}${shoe(44,162,-18)}${shoe(92,162,18)}</g>`,arms:
   `<g class="p-arm-left">${arm('M30 104Q6 94 10 62')}${hand(10,58)}</g><g class="p-arm-right">${arm('M130 104Q154 94 150 62')}${hand(150,58)}</g>`};
 case 'airplane': return {eyes:'open',legs:LEGS_STAND,arms:
   `${ARM_L_DOWN}<g class="p-arm-right">${arm('M130 104Q148 96 150 80')}${hand(150,76)}<g class="p-plane"><path d="M146 64L182 46L162 80L157 68z" fill="#fff" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round"/><path d="M157 68L182 46" stroke="#94A3B8" stroke-width="1.5"/></g></g>`};
 case 'mug': return {eyes:'calm',legs:LEGS_STAND,arms:
   `<g class="p-arm-left"><g class="p-steam" fill="none" stroke="${PC.edge}" stroke-width="2.4" stroke-linecap="round"><path d="M32 118q-4-5 0-9t0-8"/><path d="M42 118q-4-5 0-9t0-8"/></g><rect x="24" y="124" width="26" height="24" rx="5" fill="#fff" stroke="${PC.edge}" stroke-width="2"/><path d="M50 130h4q6 0 6 7t-6 7h-4" fill="none" stroke="${PC.edge}" stroke-width="3.2"/><rect x="24" y="130" width="26" height="6" fill="${PC.amber}"/>${arm('M30 106Q22 124 30 138')}${hand(32,140)}</g>

 }

 return `<span class="ping st-${state} pose-${pose} ${cls}" style="width:${Math.round(size*1.04)}px;height:${size}px" aria-hidden="true"><svg viewBox="-24 0 208 200" width="100%" height="100%">${RINGS}${P.ground||''}<g class="p-body">${P.legs}${core(EYES[eyes||P.eyes])}${P.arms}</g></svg></span>`;
}

incident:{g:'Emergency',t:'Guidance and actions',fr:['FR7','FR8'],ctx:{user:'daniel',incident:true},
 note:'Shown to standard users only: people with an assistance profile skip this page, because their help request has already been sent. The 3D plan of the floor was built in Blender, with your position, the route to the nearest stairwell and the lift marked as off limits. “I’m leaving” tells security you are on your way out. “I need help” is for anyone who gets stuck.',
 r:()=>{const g=GUIDE[S.incident.kind]; const showMap=['fire','earthquake'].includes(S.incident.kind); return `${banner()}
 <div class="scroll stack-l" style="padding-top:14px;gap:16px">
  ${offlineNote()}
  ${showMap?`<div><div class="maplab"><b style="color:var(--navy);font-size:16px">Level 22</b><span>Nearest exit: Stairwell A</span></div>${map3d()}</div>`:`<div class="guide">${towerStrip(MYFLOOR,MYFLOOR)}<div></div></div>`}
  <h1 class="h-l" tabindex="-1" style="margin:8px 0 0">${g.verb}</h1>
  <ol class="gsteps">${g.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s[0]}</span></li>`).join('')}</ol>
 </div>
 <div class="dock">
  <button class="btn pop help-btn" style="min-height:74px" data-act="needHelp">${ic('hand',28,2.2,'#fff')}I need help<small>Alerts the control room and rescue teams</small></button>
  <button class="btn" style="min-height:60px" data-act="leaving">${ic('door',22,2.4)} ${g.safeLabel}</button>
 </div>`}},

report:{g:'Everyday',t:'Report an emergency',fr:['FR24'],ctx:{user:'daniel',incident:false},
 note:'Anyone can report an emergency, signed in or not, from Home or from the first screen. Pick what is happening, and the phone adds where you are by itself (GPS for the tower, barometer for the floor). The report goes to the security control room, who decide whether to start an incident. The screen also reminds people to call 999 if someone is in danger.',
 r:()=>{const k=S.report.kind, l=S.loc, fl=l.floor; const opt=(v,ico,t)=>`<button class="pcard" role="radio" aria-checked="${k===v}" data-act="reportKind" data-v="${v}" style="min-height:64px;padding:10px 14px"><span class="pi" style="width:44px;height:44px;border-radius:14px">${ic(ico,24,2.2)}</span><b style="font-size:19px">${t}</b><span class="tick">${ic('check',16,3.2,'#fff')}</span></button>`;
 return `${appbar('Report an emergency',S.user?'home':'landing')}
 <div class="scroll stack-l" style="gap:14px">
  <h1 id="rk" class="h-l" tabindex="-1" style="font-size:24px">What’s happening?</h1>
  <div role="radiogroup" aria-labelledby="rk" class="stack" style="gap:8px">
   ${opt('fire','flame','Fire or smoke')}${opt('medical','cross','Someone is hurt or ill')}${opt('security','lock','Security threat')}${opt('other','warn','Something else')}
  </div>
  <div class="loccard" style="padding:14px" aria-live="polite">${!l.found?`<div class="locrow"><span class="ri">${ic('pin',20)}</span><b>Finding where you are</b></div>`:`<div class="locrow"><span class="ri" style="background:var(--navy);color:#fff">${ic('pin',20)}</span><span><b>Level ${fl}</b>, ${TOWER}<br><span class="small muted">Found with GPS and the barometer</span></span><span class="ok">${ic('check',22,3)}</span></div>`}</div>
 </div>
 <div class="dock"><button class="btn pop" style="min-height:64px;font-size:19px" data-act="sendReport" ${l.found?'':'disabled'}>Send report</button></div>`}},

'report-sent':{g:'Everyday',t:'Report sent',fr:['FR24'],ctx:{user:'daniel',incident:false},
 note:'Confirms the report reached the security control room, with what was reported and where. The call button is for anyone in danger, because a report in the app is not a replacement for calling 999.',
 r:()=>{const r=S.report.sent||{kind:S.report.kind,floor:S.loc.floor}; const lbl={fire:'Fire or smoke',medical:'Someone is hurt or ill',security:'Security threat',other:'Something else'}[r.kind];
 return `${appbar('Report sent',S.user?'home':'landing')}
 <div class="scroll stack-l">
  <div class="big-status ok"><span class="ring">${ic('check',34,3,'#fff')}</span><h1 class="h-l" tabindex="-1">Report sent</h1><p style="font-size:17px">${lbl}, Level ${r.floor}, ${TOWER}.</p></div>
  <div class="team"><span class="ti">${ic('shield',30,2.2,'#fff')}</span><div><b>Security control room</b><span class="pill safe"><i></i>Has your report</span></div></div>
  <div class="note warn">${ic('warn',20)}<div><b>In danger?</b> Move away from it if you can, and call <b>999</b>. For a fire, call <b>994</b>.</div></div>
 </div>
 <div class="dock"><a class="btn pop" style="min-height:64px;font-size:19px;text-decoration:none" href="tel:999">${ic('phone',22,2.4,'#fff')} Call 999</a><button class="btn ghost" data-go="${S.user?'home':'landing'}">Done</button></div>`}},

'help-sent':{g:'Emergency',t:'Help request sent',fr:['FR8','FR9'],ctx:{user:'aisyah',incident:true,help:true},
 note:'The request is already sent. The phone then works out where you are by itself: GPS finds the tower, and the barometer works out the floor from air pressure, so nobody has to type or tap where they are. A small link lets the person correct the floor. A five-second undo catches mistakes.',
 r:()=>{const l=S.loc; const fl=l.floor; const alt=Math.round(+fl*3.9);
 return `${banner()}
 <div class="scroll stack-l" style="padding-top:18px">
  ${S.offline?`<div class="note off">${ic('sms',20,2.2,'#fff')}<div><b>No signal, so we sent it by SMS.</b> Rescue teams still get the alert.</div></div>`:''}
  <div><h1 class="h-l" tabindex="-1">Help request sent</h1><p class="muted" style="margin-top:6px">${S.help&&S.help.auto?'Sent automatically from your profile. ':''}The control room and rescue teams have it.</p></div>
  ${S.undo?`<div class="undo" role="status"><div style="flex:1">Sent by mistake?<div class="bar"><i></i></div></div><button data-act="undoHelp">Undo</button></div>`:''}
  <div class="loccard" aria-live="polite">${!l.found?`
   <div class="big"><span class="sw">${ic('pin',30,2.2,'#fff')}</span><div style="flex:1;display:grid;gap:8px"><b style="font-size:20px">Finding where you are</b><span class="skel" style="width:70%"></span></div></div>
   <div class="locrow"><span class="ri">${ic('gps',20)}</span><span class="skel" style="width:60%"></span></div>
   <div class="locrow"><span class="ri">${ic('gauge',20)}</span><span class="skel" style="width:75%"></span></div>`:`
   <div class="big"><span class="sw">${ic('pin',30,2.2,'#fff')}</span><div><div class="small muted">Your location</div><div class="h-l num" style="line-height:1.1">Level ${fl}</div><div class="small muted">${TOWER}</div></div></div>
   <div class="locrow"><span class="ri">${ic('gps',20)}</span><span>Phone found the tower</span><span class="ok">${ic('check',22,3)}</span></div>
   <div class="locrow"><span class="ri">${ic('gauge',20)}</span><span>Barometer: about <b class="num">${alt} m</b> up, Level ${fl}</span><span class="ok">${ic('check',22,3)}</span></div>`}
  </div>
  ${l.found?(l.manual?`<label class="field"><span>Choose your floor</span><select class="input" data-bind="loc.floor">${Array.from({length:38},(_,i)=>`<option ${String(i+1)===l.floor?'selected':''}>${i+1}</option>`).join('')}</select></label>`:`<button class="link" data-act="floorManual" style="justify-self:start">Not right? Choose my floor</button>`):''}
 </div>
 <div class="dock"><button class="btn" data-act="whereNext" ${l.found?'':'disabled'}>Looks right</button></div>`}},

'help-status':{g:'Emergency',t:'Help on the way',fr:['FR9'],ctx:{user:'aisyah',incident:true,help:true},
 note:'Two rows, two icons. The security control room has your location at once. The Bomba rescue team shows its own arrival estimate, as the team reports it. If no team replies within 60 seconds the control room calls you.',
 r:()=>{const a=S.acks; const any=Object.keys(a).length>0;
 const pill=(on,label)=>on?`<span class="pill safe"><i></i>${label}</span>`:`<span class="pill wait"><span class="spin" aria-hidden="true"></span>Alerting</span>`;
 return `${banner()}
 <div class="scroll stack-l" style="padding-top:18px">
  <div><h1 class="h-l" tabindex="-1">${a.bomba?'Help is on the way':'Alerting rescue teams'}</h1><p class="muted" style="margin-top:6px">You’re on Level ${S.loc.floor}. Stay where you are.</p></div>
  <div class="stack">
   <div class="team"><span class="ti">${ic('shield',30,2.2,'#fff')}</span><div><b>Security control room</b>${pill(a.security,'Has your location')}</div></div>
   <div class="team"><span class="ti">${ic('helmet',30,2.2,'#fff')}</span><div><b>Bomba rescue team</b>${pill(a.bomba,'On the way')}</div>${a.bomba?`<div class="eta"><b>6</b><br>min away</div>`:''}</div>
  </div>
  ${S.help&&S.help.auto?`<button class="link" data-act="cancelAuto" style="justify-self:start">Cancel my help request</button>`:''}
 </div>
 <div class="dock"><button class="btn" data-go="checkin">${ic('check',22,2.8)} I'm safe now</button></div>`}},

checkin:{g:'Emergency',t:'Check in as safe',fr:['FR10','Offline'],ctx:{user:'daniel',incident:true},
 note:'The phone checks the person in using GPS automatically, with no toggle to find. GPS works outdoors, so it confirms they are really at the assembly point. If they are not there yet, the button waits. If there is no signal, the check-in is saved with the last position and sent later, and an SMS fallback is offered.',
 r:()=>{const g=GUIDE[S.incident.kind]; const lock=S.incident.kind==='security'; const f=S.gpsFound; return `${banner()}
 ${appbar(lock?'Tell security you’re safe':'Check in as safe','incident')}
 <div class="scroll stack-l">
  ${lock?`<p style="font-size:18px">This silently tells security you're safe where you are. Don't leave your room.</p>`:`<div class="loccard" aria-live="polite">${!f?`
   <div class="big"><span class="sw">${ic('gps',30,2.2,'#fff')}</span><div style="flex:1;display:grid;gap:8px"><b style="font-size:20px">Finding you with GPS</b><span class="skel" style="width:70%"></span></div></div>`:`
   <div class="big"><span class="sw" style="background:var(--safe)">${ic('door',30,2.4,'#fff')}</span><div><div class="small muted">${S.offline?'Last GPS position':'GPS found you at'}</div><div style="font-size:21px;font-weight:800;line-height:1.15;white-space:nowrap">Assembly point A</div><div class="small muted">South forecourt, outside the main entrance</div></div></div>
   <div class="locrow"><span class="ri">${ic('gps',20)}</span><span>${S.offline?'Saved. Confirms when signal returns':'Within <b class="num">12 m</b> of the point'}</span><span class="ok">${ic('check',22,3)}</span></div>`}
  </div>`}
  ${S.offline?`<div class="note off">${ic('wifiOff',20,2.2,'#fff')}<div><b>No signal.</b> We'll save your check-in and send it automatically. Or text <b>SAFE 22</b> to <b>32323</b> (demo number).</div></div>`:''}
  <div class="note">${ic('info',20)}<div>If someone from your floor is missing, tell security. Don't go back inside.</div></div>
 </div>
 <div class="dock"><button class="btn safe" style="min-height:72px;font-size:20px" data-act="checkin" ${lock||f?'':'disabled'}>${ic('check',26,3)} ${lock?g.safeLabel:"I'm safe"}</button></div>`}},

safe:{g:'Emergency',t:'Checked in',fr:['FR10'],ctx:{user:'daniel',incident:true,checkin:true},
 note:'A plain confirmation (“You’re safe!”) with when and where you were checked in. Below it, who else from your own office has checked in and who has not yet, so you can tell security if someone is missing. Only names and a simple here / not yet status are shown, never health or help-request details. If the check-in is queued offline, the screen says so, so nobody thinks they have been counted when they haven’t.',
 r:()=>{const q=S.checkin&&S.checkin.queued; const me=USERS[S.user]||USERS.daniel; const people=[{n:me.name,here:true,me:true},...OFFICE.people.filter(p=>p.n!==me.name)]; const here=people.filter(p=>p.here), away=people.filter(p=>!p.here);
 const row=(p,ok)=>`<div class="li"><span class="av ${ok?'n':''}">${p.n.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div class="grow"><b>${p.n}${p.me?' (you)':''}</b></div>${ok?`<span class="pill safe"><i></i>Here</span>`:`<span class="pill wait"><i></i>Not yet</span>`}</div>`;
 return `${banner()}
 <div class="scroll stack-l" style="padding-top:18px">
  <div class="pingcenter">${q?ping({pose:'airplane',state:'alert',size:104,cls:'off'}):ping({pose:'jump',state:'safe',size:108})}</div><div class="big-status ${q?'':'ok'}"><span class="ring">${q?ic('wifiOff',30,2.4,'#fff'):ic('check',34,3,'#fff')}</span>
   <h1 class="h-l" tabindex="-1">${q?'Check-in saved, not sent yet':'You’re safe!'}</h1>
   <p style="font-size:17px">${q?'It sends automatically as soon as you have signal. Or text SAFE 22 to 32323.':`Assembly point A at <span class="num">${S.checkin?S.checkin.at:'10:49'}</span>${S.gps?', confirmed by GPS':''}.`}</p></div>
  ${q?'':`<div><h2 class="sec-h">Your office, ${OFFICE.company}</h2>
   <p class="muted" style="margin:-2px 0 10px"><b class="num" style="color:var(--navy)">${here.length} of ${people.length}</b> have checked in</p>
   <div class="list">${away.map(p=>row(p,false)).join('')}${here.map(p=>row(p,true)).join('')}</div>
   <p class="small muted" style="margin-top:10px">Someone missing? Tell security. Don’t go back inside.</p></div>`}
 </div>
 <div class="dock"><button class="btn ghost" data-go="incident">Back to guidance</button></div>`}},

ended:{g:'Emergency',t:'All clear',fr:['FR14'],ctx:{user:'aisyah',incident:false},
 note:'When UOA ends the incident, each person gets a short personal timeline. It is the same record UOA reviews afterwards, so people can check it and correct it.',
 r:()=>`${appbar('All clear',null)}
 <div class="scroll stack-l">
  <div class="pingcenter">${ping({pose:'mug',state:'safe',size:124})}</div><div class="big-status ok"><span class="ring">${ic('sun',32,2.4,'#fff')}</span><h1 class="h-l" tabindex="-1">The incident is over</h1><p style="font-size:17px">UOA security ended the fire alert at <span class="num">11:20</span>. Wait for security before going back inside.</p></div>
  <div><h2 class="sec-h">Your timeline</h2><ol class="steps">
   <li><span><b>10:41 Fire alert received</b><span class="small muted">Level 22, ${TOWER}</span></span></li>
   <li><span><b>10:42 Help requested for you</b><span class="small muted">Stairwell B waiting point</span></span></li>
   <li><span><b>10:42 Rescue teams acknowledged</b><span class="small muted">First reply after 14 seconds</span></span></li>
   <li><span><b>10:58 Bomba helped you down</b><span class="small muted">Logged by the Bomba team</span></span></li>
   <li><span><b>11:03 Checked in safe</b><span class="small muted">Assembly point A</span></span></li></ol></div>
  <button class="btn ghost" data-act="toastFeedback">Tell UOA how it went</button>
 </div>
 <div class="dock"><button class="btn" data-go="home">Back to home</button></div>`},

visitor:{g:'Visitor',t:'Visitor check-in',fr:['FR13'],ctx:{user:null},
 note:'Visitors, podium shoppers and hotel guests scan a QR code at reception. No account and no password: just a name, who they are visiting and, optionally, a number for SMS alerts.',
 r:()=>{const v=S.visitor; return `${appbar('Visitor check-in','landing')}
 <div class="scroll stack-l">
  <div class="panel" style="display:flex;gap:12px;align-items:center">${ic('qr',30)}<div><b>${TOWER}</b><br><span class="small muted">You scanned the reception code</span></div></div>
  ${pingRow(ping({pose:'wave',size:104}),'So we can count you if there’s an emergency. No account needed. Your details are deleted at midnight.')}
  <label class="field"><span>Your name</span><input class="input" data-bind="visitor.name" value="${v.name}" placeholder="e.g. Tan Wei Ming" autocomplete="name"></label>
  <label class="field"><span>Who are you visiting?</span><input class="input" data-bind="visitor.host" value="${v.host}"></label>
  <label class="field"><span>Floor</span><select class="input" data-bind="visitor.floor">${Array.from({length:38},(_,i)=>`<option ${String(i+1)===v.floor?'selected':''}>${i+1}</option>`).join('')}</select></label>
  <label class="field"><span>Mobile number <em>Optional, for SMS alerts</em></span><input class="input" type="tel" data-bind="visitor.phone" value="${v.phone}" placeholder="012 345 6789" autocomplete="tel"></label>
 </div>
 <div class="dock"><button class="btn" data-act="visitorIn">Check in</button></div>`}},

'visitor-in':{g:'Visitor',t:'Visitor during incident',fr:['FR13','FR7'],ctx:{user:null,visitorIn:true},
 note:'The visitor keeps this page open in their browser. If an incident is triggered it switches to the same guidance staff see, with "I’m safe" and "I need help" buttons that need no account.',
 r:()=>{const v=S.visitor, g=S.incident&&GUIDE[S.incident.kind]; if(!S.incident) return `${appbar('You’re checked in',null)}
 <div class="scroll stack-l"><div class="big-status"><span class="ring">${ic('check',32,3,'#fff')}</span><h1 class="h-l" tabindex="-1">Welcome, ${v.name||'visitor'}</h1><p>Level ${v.floor}, visiting ${v.host}. Until 6:00 pm today.</p></div>
 <div class="note">${ic('info',20)}<div>Keep this page open. If there's an emergency it will tell you what to do.</div></div>
 <p class="small muted">Use the demo controls to trigger an incident and see this page change.</p></div>`;
 if(S.visitorSafe) return `${banner()}<div class="scroll stack-l" style="padding-top:22px"><div class="big-status ok"><span class="ring">${ic('check',34,3,'#fff')}</span><h1 class="h-l" tabindex="-1">Thanks, you're counted as safe</h1><p>Stay at Assembly point A until the all clear.</p></div></div>`;
 return `${banner()}
 <div class="scroll stack-l" style="padding-top:16px"><h1 class="h-l" tabindex="-1">${g.verb}</h1><ol class="steps">${g.steps.map(s=>`<li><span><b>${s[0]}</b><span class="small muted">${s[1]}</span></span></li>`).join('')}</ol></div>
 <div class="dock"><button class="btn pop help-btn" style="min-height:84px" data-act="visitorHelp">${ic('hand',26,2.2,'#fff')}I need help</button><button class="btn" data-act="visitorSafe">${ic('check',22,2.8)} ${g.safeLabel}</button></div>`}}

  <rect x="80" y="116" width="30" height="8" fill="#FF5A1F"/>
  <path d="M95 128 v12" stroke="#14213D" stroke-width="3" stroke-dasharray="3 4"/>
  <rect x="50" y="188" width="140" height="34" rx="10" fill="#DDF2E6" stroke="#1D8A55" stroke-width="2.5"/><text x="120" y="210" text-anchor="middle" font-size="13" font-weight="800" fill="#1D8A55" font-family="inherit">Assembly point A</text>
 </svg>`;}

/* =========================================================
   Context, routing, render
   ========================================================= */
const ORDER = Object.keys(SCREENS);
let cur = 'landing';

function ensure(ctx){
 if(!ctx) return;
 if(ctx.force) S.user = ctx.force;
 else if(ctx.user && !S.user) S.user = ctx.user;
 if(ctx.incident===true && !S.incident) S.incident={kind:S.kind,t0:Date.now()};
 if(ctx.incident===false) S.incident=null;
 if(ctx.help && !S.help) S.help={at:demoTime(35)};
 if(ctx.checkin && !S.checkin) S.checkin={at:'10:49',queued:false};
 if(ctx.visitorIn) S.visitorIn=true;
}

function go(id){ if(location.hash.slice(1)===id) { cur=id; render(); } else location.hash=id; }
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(SCREENS[id]){cur=id; onEnter(id); render();} });

function onEnter(id){
 clearTimers();
 ensure(SCREENS[id].ctx);
 if(id==='alert'){ try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400]);}catch(e){} }
 if((id==='alert'||id==='incident') && S.user==='aisyah' && S.profile.need!=='no' && !S.help && !S.autoOff) autoHelp();
 if(id==='report'){ S.loc.found=false; S.loc.manual=false; later(()=>{S.loc.found=true; render(true);},1400); }
 if(id==='checkin'){ S.gpsFound=false; later(()=>{S.gpsFound=true; render(true);},1400); }
 if(id==='help-sent'){ S.loc.found=false; S.loc.manual=false; later(()=>{S.loc.found=true; render(true);},1500); S.undo=true; later(()=>{S.undo=false; render(true);},5000); }
 if(id==='help-status' && Object.keys(S.acks).length<2){
   const plan=[['security',1800,'10:42'],['bomba',4200,'10:42']];
   plan.forEach(([k,ms,t])=>{ if(!S.acks[k]) later(()=>{ S.acks[k]=t; say(`${{security:'Security control room has your location',bomba:'Bomba rescue team is on the way'}[k]}`); post({type:'help.ack',person:'Aisyah Rahman',by:{security:'UOA security',bomba:'Bomba rescue team'}[k],role:k==='bomba'?'rescue':'security',eta:k==='bomba'?'about 6 minutes':undefined,at:demoTime(49)}); render(true); },ms); });
   let n=60; const tick=()=>{ const el=document.querySelector('[data-count]'); if(el){ n--; el.textContent=n+'s'; } if(n>0 && !Object.keys(S.acks).length) later(tick,1000); }; later(tick,1000);
 }
}

const say = m => { const l=document.getElementById('live'); l.textContent=''; setTimeout(()=>l.textContent=m,30); };

function render(keepFocus){
 const sc = SCREENS[cur];
 const v = document.getElementById('view');
 const scrollEl = v.querySelector('.scroll'); const st = keepFocus && scrollEl ? scrollEl.scrollTop : 0;
 const active = keepFocus && document.activeElement && document.activeElement.dataset ? document.activeElement : null;
 const activeKey = active && (active.dataset.act ? `[data-act="${active.dataset.act}"]${active.dataset.v?`[data-v="${active.dataset.v}"]`:''}${active.dataset.n?`[data-n="${active.dataset.n}"]`:''}` : active.dataset.bind ? `[data-bind="${active.dataset.bind}"]` : null);
 const darkTop = ['alert'].includes(cur) || (S.incident && sc.r.toString().includes('banner()'));
 const sb = document.getElementById('sbar'); sb.innerHTML = sbar(); sb.style.background = darkTop ? 'var(--orange)' : 'transparent'; sb.style.color = darkTop ? '#fff' : 'var(--navy)';
 v.innerHTML = sc.r() + (S.toast?`<div class="toast" role="status">${ic('check',20,2.8)}${S.toast}</div>`:'');
 const ns = v.querySelector('.scroll'); if(ns && keepFocus) ns.scrollTop = st;
 if(keepFocus && activeKey){ const el=v.querySelector(activeKey); el && el.focus(); }
 else if(!keepFocus){ const h=v.querySelector('h1'); h && h.focus({preventScroll:true}); }
 // rail + notes
 document.querySelectorAll('#railList button').forEach(b=>b.setAttribute('aria-current', b.dataset.go===cur));
 document.getElementById('mSel').value = cur;
 const bk=document.getElementById('bk'); if(bk && BACKUP.includes(cur)) bk.open=true;
 document.getElementById('noteBody').innerHTML = `<p class="small muted" style="margin:0 0 4px">${sc.g}</p><h3>${sc.t}</h3><div class="tags">${(()=>{const g=groupOf(cur);return g?`<span class="tag ${g.k==='backup'?'bk':'hl'}">${g.tag}</span>`:''})()}${sc.fr.map(f=>`<span class="tag">${f}</span>`).join('')}</div><p>${sc.note}</p>${PING_META[cur]?`<p class="small" style="display:flex;gap:10px;align-items:center;margin-top:14px">${pingBust({size:34})}<span><b>Ping.</b> ${PING_META[cur]}</span></p>`:''}`;
 document.getElementById('cUser').value = S.user||'';
 document.getElementById('cKind').value = S.incident?S.incident.kind:S.kind;
 document.getElementById('cOff').setAttribute('aria-checked', S.offline);
 tickElapsed();
}

function tickElapsed(){ const el=document.querySelector('[data-elapsed]'); if(el && S.incident){ const s=Math.floor((Date.now()-S.incident.t0)/1000); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; } }
setInterval(()=>{ tickElapsed(); if(S.incident){ const sb=document.getElementById('sbar'); const t=sb.querySelector('.num'); if(t) t.textContent=demoTime(Math.floor((Date.now()-S.incident.t0)/1000)); } },1000);

/* =========================================================
   Actions
   ========================================================= */
const incidentFor = u => ({aisyah:'alert',daniel:'alert'}[u]||'visitor-in');
function autoHelp(){ S.help={at:demoTime(35),auto:true}; S.acks={}; post({type:'help.request',person:USERS[S.user].name,floor:22,where:S.where,locatedBy:'gps+barometer',auto:true,at:demoTime(35)}); }

const A = {
 login:el=>{ S.user=el.dataset.u; go(S.incident?'incident':'home'); },
 logout:()=>{ S.user=null; go('landing'); },
 signupNext:()=>{ S.user='aisyah'; go('consent'); },
 consent:()=>{ S.consent=!S.consent; render(true); },
 skipHealth:()=>{ S.profile.need='no'; S.profile.temp=false; S.user='aisyah'; go('home'); },
 need:el=>{ S.profile.need=el.dataset.v; render(true); },
 temp:()=>{ S.profile.temp=!S.profile.temp; render(true); },
 tempType:el=>{ S.profile.tempType=el.dataset.v==='Recovering'?'Recovering from surgery':el.dataset.v; render(true); },
 saveProfile:()=>{ go('home'); },
 toastHR:()=>toast('Request sent to Meridian Legal HR'),
 toastFeedback:()=>toast('Thanks. Your feedback went to UOA.'),
 mapView:el=>{ S.mapView=el.dataset.v; render(true); },
 cancelAuto:()=>{ S.help=null; S.autoOff=true; S.acks={}; post({type:'help.cancel',person:USERS[S.user].name,floor:22}); go('incident'); later(()=>toast('Help request cancelled'),60); },
 alertGo:()=>{ const needs=S.user==='aisyah'&&S.profile.need!=='no'&&!S.autoOff; go(needs?'help-sent':'incident'); },
 leaving:()=>{ const out=['fire','earthquake'].includes(S.incident.kind); if(out) post({type:'leaving',person:USERS[S.user]?USERS[S.user].name:'Visitor',floor:22,at:demoTime(Math.floor((Date.now()-S.incident.t0)/1000)+30)}); go('checkin'); if(out) later(()=>toast('Security knows you’re leaving'),60); },
 needHelp:()=>{ S.autoOff=false; S.help={at:demoTime(35)}; S.acks={}; post({type:'help.request',person:USERS[S.user].name,floor:22,where:S.where,locatedBy:'gps+barometer',at:demoTime(35)}); go('help-sent'); },
 undoHelp:()=>{ S.help=null; S.autoOff=true; S.undo=false; post({type:'help.cancel',person:USERS[S.user].name,floor:22}); go('incident'); later(()=>toast('Help request cancelled'),50); },
 where:el=>{ S.where=el.dataset.v; render(true); },
 whereNext:()=>go('help-status'),
 reportKind:el=>{ S.report.kind=el.dataset.v; render(true); },
 sendReport:()=>{ S.report.sent={kind:S.report.kind,floor:S.loc.floor}; post({type:'report',kind:S.report.kind,person:S.user?USERS[S.user].name:'Not signed in',floor:+S.loc.floor,locatedBy:'gps+barometer',at:demoTime(Math.floor((Date.now()-(S.incident?S.incident.t0:Date.now()))/1000)+20)}); go('report-sent'); },
 floorManual:()=>{ S.loc.manual=true; render(true); },
 gps:()=>{ S.gps=!S.gps; render(true); },
 checkin:()=>{ const at=demoTime(Math.floor((Date.now()-S.incident.t0)/1000)+420); S.checkin={at,queued:S.offline}; if(!S.offline) post({type:'checkin',person:USERS[S.user]?USERS[S.user].name:'Visitor',status:'safe',place:'Assembly point A',gps:S.gps,at}); go('safe'); },
 visitorIn:()=>{ S.visitorIn=true; go('visitor-in'); },
 visitorSafe:()=>{ S.visitorSafe=true; post({type:'checkin',person:S.visitor.name||'Visitor',status:'safe',place:'Assembly point A',gps:false,at:demoTime(400)}); render(); },
 visitorHelp:()=>toast('Security has been told you need help on Level '+S.visitor.floor),
 // demo controls
 trigger:()=>{ S.kind=document.getElementById('cKind').value; S.incident={kind:S.kind,t0:Date.now()}; S.help=null; S.acks={}; S.checkin=null; S.visitorSafe=false; S.autoOff=false;
   post({type:'incident.start',incident:{kind:S.kind,tower:TOWER,floor:22,at:'10:41:30'}});
   if(cur==='visitor-in'||cur==='visitor'){ S.visitorIn=true; go('visitor-in'); } else { if(!S.user) S.user='aisyah'; go(incidentFor(S.user)); } },
 endIncident:()=>{ S.incident=null; post({type:'incident.end'}); if(cur==='visitor-in'){render();} else go(S.user==='aisyah'?'ended':'home'); },
 simHelp:()=>{ if(!S.incident) S.incident={kind:S.kind,t0:Date.now()}; S.user='aisyah'; S.autoOff=false; autoHelp(); go('help-status'); },
 offline:()=>{ S.offline=!S.offline; render(true); },
 reset:()=>{ clearTimers(); S=fresh(); go('landing'); }
};

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
 const a=e.target.closest('[data-act]'); if(a && A[a.dataset.act]){ e.preventDefault(); A[a.dataset.act](a); }
});
document.addEventListener('input',e=>{ const b=e.target.dataset && e.target.dataset.bind; if(!b) return; const [o,k]=b.split('.'); S[o][k]=e.target.value; });
document.addEventListener('change',e=>{ const b=e.target.dataset && e.target.dataset.bind; if(b){ const [o,k]=b.split('.'); S[o][k]=e.target.value; } });

document.getElementById('cUser').addEventListener('change',e=>{ S.user=e.target.value||null; if(!S.user){go('landing');return;} if(S.incident){ go('incident'); } else go('home'); });
document.getElementById('cKind').addEventListener('change',e=>{ S.kind=e.target.value; if(S.incident){ S.incident.kind=S.kind; post({type:'incident.start',incident:{kind:S.kind,tower:TOWER,floor:22,at:'10:41:30'}}); render(true);} });

if(bc) bc.onmessage = ({data:m}) => {
 if(!m||!m.type) return;
 if(m.type==='incident.start'){ S.kind=m.incident.kind; S.incident={kind:m.incident.kind,t0:Date.now()}; go(S.user?incidentFor(S.user):(S.visitorIn?'visitor-in':'alert')); }
 if(m.type==='incident.end'){ S.incident=null; go(S.user==='aisyah'?'ended':S.visitorIn?'visitor-in':'home'); }
};

/* Rail + mobile select: grouped by the 3-minute demo plan (MINIMUM_PAGES.md) */
const PING_META={
 landing:'Waves at full size on this calm screen, with the compact badge as the logo. Standby (cobalt).',
 signup:'Waves while holding a QR pass. Standby (cobalt).',
 profile:'Checklist and coffee. Standby (cobalt).',
 map:'Points at the plan. Hidden during an incident, so the map stays clear.',
 home:'Compact badge beside the calm status. Standby (cobalt).',
 'help-status':'Seated at the waiting point. Alert (amber) with radar ripples while rescue teams respond.',
 safe:'Celebration jump, safe (green). If the check-in is queued offline: paper airplane, dashed amber ring.',
 ended:'Relaxed with a mug and a green check. Safe (green).',
 visitor:'Waves. Standby (cobalt).'
};
const GROUPS=[
 {k:'path',title:'Demo path',tag:'Demo path',sub:'In run order',numbered:true,items:[['landing','15s'],['login','5s'],['profile','15s'],['alert','8s'],['help-sent','8s'],['help-status','17s']]},
 {k:'flash',title:'Optional flash',tag:'Optional flash',sub:'Say out loud, or show if ahead',items:[['incident','standard user'],['checkin',''],['safe','']]},
 {k:'backup',title:'Backup for Q&A',tag:'Backup',items:[['signup'],['consent'],['home'],['map'],['account'],['ended'],['report'],['report-sent'],['visitor'],['visitor-in']]}
];
const BACKUP = GROUPS[2].items.map(i=>i[0]);
const groupOf = id => GROUPS.find(g=>g.items.some(i=>i[0]===id));
(function(){
 const btn=(id,t,n)=>`<button data-go="${id}">${n?`<span class="n">${n}</span>`:''}<span>${SCREENS[id].t}</span><span class="fr">${t||SCREENS[id].fr[0]}</span></button>`;
 let html='';
 GROUPS.forEach(g=>{
  if(g.k==='backup'){ html+=`<details id="bk"><summary>${g.title} (${g.items.length})</summary>${g.items.map(([id])=>btn(id)).join('')}</details>`; }
  else html+=`<h2>${g.title}${g.sub?` <small>${g.sub}</small>`:''}</h2>`+g.items.map(([id,t],i)=>btn(id,t,g.numbered?i+1:'')).join('');
 });
 document.getElementById('railList').innerHTML=html;
 document.getElementById('mSel').innerHTML = GROUPS.map(g=>`<optgroup label="${g.title}">${g.items.map(([id])=>`<option value="${id}">${SCREENS[id].t}</option>`).join('')}</optgroup>`).join('');
 document.getElementById('mSel').addEventListener('change',e=>go(e.target.value));
 document.getElementById('cUser').innerHTML = `<option value="">Signed out</option>`+Object.entries(USERS).map(([k,u])=>`<option value="${k}">${u.name}, ${u.label.toLowerCase()}</option>`).join('');
})();

document.getElementById('railMark').innerHTML=pingBust({size:40}); document.getElementById('mMark').innerHTML=pingBust({size:32});
const start = location.hash.slice(1);
cur = SCREENS[start]?start:'landing'; onEnter(cur); render();
</script>
</body>
</html>
